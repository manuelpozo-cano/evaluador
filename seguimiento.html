<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuaderno de Seguimiento LOMLOE - Manuel Pozo Cano</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-book-bookmark text-2xl text-amber-400"></i>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Cuaderno de Seguimiento LOMLOE</h1>
                    <p class="text-xs text-indigo-200">Colegio La Hispanidad | Manuel Pozo Cano</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <a href="index.html" class="px-3 py-1.5 bg-indigo-800 hover:bg-indigo-700 text-xs font-semibold rounded-lg transition flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-house"></i> 🏠 Volver al Inicio
                </a>
                <a href="evaluador_directo.html" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold rounded-lg transition flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-pen-to-square"></i> 📝 Evaluador Directo
                </a>
            </div>
        </div>
    </header>

    <!-- Estado de Sincronización y Filtros -->
    <main class="max-w-7xl mx-auto w-full px-4 py-6 flex-grow">
        <div class="bg-white rounded-xl shadow-md p-4 mb-6 border border-slate-200 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <span id="sync-status-dot" class="w-3 h-3 rounded-full bg-amber-500 animate-pulse"></span>
                <span id="sync-status-text" class="text-xs font-medium text-slate-600">Sincronizando datos...</span>
            </div>
            
            <div class="flex flex-wrap gap-2" id="curso-tabs">
                <button onclick="cambiarCurso('2ESO')" class="curso-btn px-4 py-1.5 rounded-lg text-xs font-bold transition bg-indigo-600 text-white shadow-sm" data-curso="2ESO">2º ESO (TYD)</button>
                <button onclick="cambiarCurso('3ESO')" class="curso-btn px-4 py-1.5 rounded-lg text-xs font-bold transition bg-slate-200 text-slate-700 hover:bg-slate-300" data-curso="3ESO">3º ESO (TYD)</button>
                <button onclick="cambiarCurso('4ESO')" class="curso-btn px-4 py-1.5 rounded-lg text-xs font-bold transition bg-slate-200 text-slate-700 hover:bg-slate-300" data-curso="4ESO">4º ESO (DIG)</button>
            </div>

            <div class="flex gap-2">
                <button onclick="forzarSincronizacionTotal()" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white text-xs font-medium rounded-lg transition flex items-center gap-1 shadow-sm" title="Subir y descargar todas las notas con la nube">
                    <i class="fa-solid fa-rotate"></i> Sincronizar Todo con Nube
                </button>
            </div>
        </div>

        <!-- Tabla Matriz de Seguimiento -->
        <div class="bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h2 class="font-bold text-slate-800 text-base flex items-center gap-2">
                    <i class="fa-solid fa-table-cells text-indigo-600"></i>
                    Matriz Integradora de Calificaciones por Criterio
                </h2>
                <span id="total-alumnos-badge" class="text-xs bg-indigo-100 text-indigo-800 px-2.5 py-1 rounded-full font-semibold">0 Alumnos</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse" id="tabla-seguimiento">
                    <thead class="bg-slate-100 text-slate-700 uppercase font-semibold border-b border-slate-300" id="tabla-head">
                    </thead>
                    <tbody class="divide-y divide-slate-200" id="tabla-body">
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Configuración Firebase
        const firebaseConfig = {
            apiKey: "AIzaSy_Hispanidad_FirebaseKey_Placeholder",
            authDomain: "cyberbreakout-hispanidad.firebaseapp.com",
            projectId: "cyberbreakout-hispanidad",
            storageBucket: "cyberbreakout-hispanidad.appspot.com",
            messagingSenderId: "1035515234125",
            appId: "1:1035515234125:web:hispanidad2026"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        db.enablePersistence({ synchronizeTabs: true }).catch(err => console.log("Persistencia local activada:", err.code));

        // Normalización flexible de nombres de curso ("2º ESO", "2 ESO A", "2ESO" -> "2ESO")
        function normalizarCurso(cursoRaw) {
            if (!cursoRaw) return '2ESO';
            const str = String(cursoRaw).toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (str.includes('2')) return '2ESO';
            if (str.includes('3')) return '3ESO';
            if (str.includes('4')) return '4ESO';
            return '2ESO';
        }

        const criteriosLOMLOE = {
            '2ESO': ['TYD.2.1.1', 'TYD.2.1.2', 'TYD.2.2.1', 'TYD.2.3.1', 'TYD.2.4.1', 'TYD.2.5.1'],
            '3ESO': ['TYD.3.1.1', 'TYD.3.1.2', 'TYD.3.2.1', 'TYD.3.3.1', 'TYD.3.4.1', 'TYD.3.5.1'],
            '4ESO': ['DIG.4.1.1', 'DIG.4.1.2', 'DIG.4.2.1', 'DIG.4.3.1', 'DIG.4.4.1', 'DIG.4.5.1']
        };

        let cursoActual = '2ESO';
        let datosAlumnos = {}; 

        // REGISTRO DE NOTAS SIN DUPLICADOS (REGLA LOMLOE)
        function registrarNotaConOrigen(alumnoId, curso, criterio, nota, origen, nombreAlumnoFallback) {
            if (!alumnoId) return;
            const cursoNorm = normalizarCurso(curso);
            const origenLimpio = (origen || 'General').trim();
            const valNota = parseFloat(nota);

            if (!datosAlumnos[alumnoId]) {
                datosAlumnos[alumnoId] = {
                    id: alumnoId,
                    nombre: nombreAlumnoFallback || 'Alumno',
                    curso: cursoNorm,
                    notas: []
                };
            }

            const alum = datosAlumnos[alumnoId];
            if (nombreAlumnoFallback && (alum.nombre === 'Alumno' || !alum.nombre)) {
                alum.nombre = nombreAlumnoFallback;
            }
            if (curso) alum.curso = cursoNorm;

            if (!isNaN(valNota) && criterio) {
                const index = alum.notas.findIndex(n => n.criterio === criterio && (n.origen || '').trim() === origenLimpio);
                if (index !== -1) {
                    alum.notas[index].nota = valNota;
                    alum.notas[index].fecha = new Date().toISOString();
                } else {
                    alum.notas.push({
                        criterio: criterio,
                        nota: valNota,
                        origen: origenLimpio,
                        fecha: new Date().toISOString()
                    });
                }
            }
        }

        // ESCANEO DINÁMICO DE TODO LOCALSTORAGE (Respetar 100% de listas y SdAs cargadas)
        function escanearTodoLocalStorage() {
            try {
                // 1. Alumnos de lista de clase
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.includes('alumnos') || key.includes('evaluador_directo')) {
                        try {
                            const parsed = JSON.parse(localStorage.getItem(key));
                            if (Array.isArray(parsed)) {
                                parsed.forEach(a => {
                                    if (a && (a.id || a.alumnoId)) {
                                        const id = a.id || a.alumnoId;
                                        const nom = a.nombre || a.nombreAlumno || a.alumno;
                                        const cur = normalizarCurso(a.curso || a.grupo);
                                        if (!datosAlumnos[id]) {
                                            datosAlumnos[id] = { id: id, nombre: nom || 'Alumno', curso: cur, notas: [] };
                                        } else {
                                            if (nom) datosAlumnos[id].nombre = nom;
                                            if (cur) datosAlumnos[id].curso = cur;
                                        }
                                    }
                                });
                            }
                        } catch(e){}
                    }
                }

                // 2. Pruebas y notas de todas las SdAs y Evaluador Directo
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.includes('alumnos')) continue;
                    try {
                        const data = JSON.parse(localStorage.getItem(key));
                        if (Array.isArray(data)) {
                            data.forEach(item => {
                                if (item && (item.alumnoId || item.id) && item.criterio && item.nota !== undefined) {
                                    registrarNotaConOrigen(
                                        item.alumnoId || item.id,
                                        item.curso || item.grupo,
                                        item.criterio,
                                        item.nota,
                                        item.origen || item.sda || key,
                                        item.nombreAlumno || item.nombre || item.alumno
                                    );
                                }
                            });
                        }
                    } catch(e){}
                }
            } catch (err) {
                console.error("Error escaneando localStorage:", err);
            }
            renderizarTabla();
        }

        // LISTENERS DE FIREBASE EN TIEMPO REAL (Móvil, Tablet y PC)
        function inicializarListenersFirebase() {
            const statusDot = document.getElementById('sync-status-dot');
            const statusText = document.getElementById('sync-status-text');

            // Cargar alumnos guardados en la nube
            db.collection('alumnos_v2').onSnapshot(snapshot => {
                snapshot.forEach(doc => {
                    const a = doc.data();
                    if (a && a.id) {
                        if (!datosAlumnos[a.id]) {
                            datosAlumnos[a.id] = { id: a.id, nombre: a.nombre || 'Alumno', curso: normalizarCurso(a.curso), notas: [] };
                        } else {
                            if (a.nombre) datosAlumnos[a.id].nombre = a.nombre;
                            if (a.curso) datosAlumnos[a.id].curso = normalizarCurso(a.curso);
                        }
                    }
                });
                renderizarTabla();
            }, err => console.log("Nota alumnos remote sync:", err));

            // Escuchar colección principal de evaluaciones
            db.collection('evaluaciones').onSnapshot(snapshot => {
                snapshot.docChanges().forEach(change => {
                    const d = change.doc.data();
                    if (d && d.alumnoId && d.criterio) {
                        registrarNotaConOrigen(d.alumnoId, d.curso, d.criterio, d.nota, d.origen, d.nombreAlumno);
                    }
                });
                statusDot.className = "w-3 h-3 rounded-full bg-emerald-500";
                statusText.innerText = "Sincronizado en tiempo real con Firebase";
                renderizarTabla();
            }, err => {
                statusDot.className = "w-3 h-3 rounded-full bg-amber-500";
                statusText.innerText = "Modo Local / Caché Activo";
            });

            // Escuchar colección de evaluacion_directa
            db.collection('evaluacion_directa').onSnapshot(snapshot => {
                snapshot.docChanges().forEach(change => {
                    const d = change.doc.data();
                    if (d && d.alumnoId && d.criterio) {
                        registrarNotaConOrigen(d.alumnoId, d.curso, d.criterio, d.nota, d.origen, d.nombreAlumno);
                    }
                });
                renderizarTabla();
            });
        }

        // FORZAR SINCRONIZACIÓN TOTAL BIDIRECCIONAL
        function forzarSincronizacionTotal() {
            let count = 0;
            const batch = db.batch();

            Object.values(datosAlumnos).forEach(alumno => {
                // Subir lista de alumnos
                const alumRef = db.collection('alumnos_v2').doc(alumno.id);
                batch.set(alumRef, { id: alumno.id, nombre: alumno.nombre, curso: alumno.curso }, { merge: true });

                // Subir notas
                alumno.notas.forEach(n => {
                    const docId = `${alumno.id}_${n.criterio}_${encodeURIComponent((n.origen || '').trim())}`;
                    const ref = db.collection('evaluaciones').doc(docId);
                    batch.set(ref, {
                        alumnoId: alumno.id,
                        nombreAlumno: alumno.nombre,
                        curso: alumno.curso,
                        criterio: n.criterio,
                        nota: n.nota,
                        origen: n.origen,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                    count++;
                });
            });

            batch.commit().then(() => {
                alert(`¡Sincronización completada! ${count} calificaciones sincronizadas con la nube.`);
            }).catch(err => {
                console.error("Error al sincronizar:", err);
                alert("Las notas se guardan localmente y se subirán al reconectar.");
            });
        }

        function cambiarCurso(curso) {
            cursoActual = curso;
            document.querySelectorAll('.curso-btn').forEach(btn => {
                if (btn.dataset.curso === curso) {
                    btn.className = "curso-btn px-4 py-1.5 rounded-lg text-xs font-bold transition bg-indigo-600 text-white shadow-sm";
                } else {
                    btn.className = "curso-btn px-4 py-1.5 rounded-lg text-xs font-bold transition bg-slate-200 text-slate-700 hover:bg-slate-300";
                }
            });
            renderizarTabla();
        }

        function renderizarTabla() {
            const head = document.getElementById('tabla-head');
            const body = document.getElementById('tabla-body');
            const baseCriterios = criteriosLOMLOE[cursoActual] || [];

            // Obtener todos los alumnos que pertenezcan a este curso (con normalización)
            const alumnosFiltrados = Object.values(datosAlumnos).filter(a => normalizarCurso(a.curso) === cursoActual);
            document.getElementById('total-alumnos-badge').innerText = `${alumnosFiltrados.length} Alumnos en ${cursoActual}`;

            // Recopilar criterios dinámicos si existen notas asociadas
            const criteriosSet = new Set(baseCriterios);
            alumnosFiltrados.forEach(a => {
                a.notas.forEach(n => { if (n.criterio) criteriosSet.add(n.criterio); });
            });
            const criterios = Array.from(criteriosSet);

            // Cabecera
            let headHTML = `<tr><th class="py-3 px-4 bg-slate-200 w-1/4">Alumno / Alumna</th>`;
            criterios.forEach(crit => {
                headHTML += `<th class="py-3 px-3 text-center border-l border-slate-300 bg-slate-100">${crit}</th>`;
            });
            headHTML += `<th class="py-3 px-4 text-center border-l border-slate-300 bg-indigo-100 text-indigo-900">Media Curso</th></tr>`;
            head.innerHTML = headHTML;

            // Cuerpo
            if (alumnosFiltrados.length === 0) {
                body.innerHTML = `<tr><td colspan="${criterios.length + 2}" class="py-6 text-center text-slate-400">No hay registros de alumnos para ${cursoActual}.</td></tr>`;
                return;
            }

            let bodyHTML = '';
            alumnosFiltrados.forEach(alum => {
                bodyHTML += `<tr class="hover:bg-slate-50 transition">
                    <td class="py-3 px-4 font-semibold text-slate-900 border-b border-slate-200">${alum.nombre}</td>`;

                let sumaMediasCriterio = 0;
                let criteriosEvaluados = 0;

                criterios.forEach(crit => {
                    const notasCrit = alum.notas.filter(n => n.criterio === crit);
                    if (notasCrit.length > 0) {
                        const mediaCrit = notasCrit.reduce((acc, curr) => acc + curr.nota, 0) / notasCrit.length;
                        sumaMediasCriterio += mediaCrit;
                        criteriosEvaluados++;
                        const badgeColor = mediaCrit >= 5 ? 'bg-emerald-100 text-emerald-800 border-emerald-300' : 'bg-rose-100 text-rose-800 border-rose-300';
                        bodyHTML += `<td class="py-3 px-3 text-center border-l border-slate-200">
                            <span class="inline-block px-2 py-0.5 rounded border text-xs font-bold ${badgeColor}" title="${notasCrit.length} nota(s)">
                                ${mediaCrit.toFixed(1)}
                            </span>
                        </td>`;
                    } else {
                        bodyHTML += `<td class="py-3 px-3 text-center border-l border-slate-200 text-slate-300">-</td>`;
                    }
                });

                const mediaFinal = criteriosEvaluados > 0 ? (sumaMediasCriterio / criteriosEvaluados).toFixed(2) : '-';
                const finalBadge = mediaFinal >= 5 ? 'bg-indigo-600 text-white' : (mediaFinal === '-' ? 'bg-slate-200 text-slate-500' : 'bg-rose-600 text-white');

                bodyHTML += `<td class="py-3 px-4 text-center border-l border-slate-200 font-bold">
                    <span class="px-2.5 py-1 rounded-md text-xs font-extrabold ${finalBadge}">${mediaFinal}</span>
                </td></tr>`;
            });

            body.innerHTML = bodyHTML;
        }

        window.addEventListener('DOMContentLoaded', () => {
            escanearTodoLocalStorage();
            inicializarListenersFirebase();
        });
    </script>
</body>
</html>
