<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluador Directo LOMLOE - Manuel Pozo Cano</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-emerald-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-pen-to-square text-2xl text-emerald-300"></i>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Evaluador Directo LOMLOE</h1>
                    <p class="text-xs text-emerald-200">Colegio La Hispanidad | Registro Instantáneo</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <a href="index.html" class="px-3 py-1.5 bg-emerald-800 hover:bg-emerald-700 text-xs font-semibold rounded-lg transition flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-house"></i> 🏠 Volver al Inicio
                </a>
                <a href="seguimiento.html" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold rounded-lg transition flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-book-bookmark"></i> 📊 Cuaderno de Seguimiento
                </a>
            </div>
        </div>
    </header>

    <!-- Panel Principal -->
    <main class="max-w-7xl mx-auto w-full px-4 py-6 flex-grow">
        <!-- Selector de Curso y Criterio -->
        <div class="bg-white rounded-xl shadow-md p-5 mb-6 border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Curso / Grupo</label>
                <select id="select-curso" onchange="actualizarCriteriosYCargar()" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg p-2.5 font-semibold focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    <option value="2ESO">2º ESO - Tecnología y Digitalización</option>
                    <option value="3ESO">3º ESO - Tecnología y Digitalización</option>
                    <option value="4ESO">4º ESO - Digitalización</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Criterio de Evaluación</label>
                <select id="select-criterio" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg p-2.5 font-semibold focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nombre de la Prueba / Ejercicio</label>
                <input type="text" id="input-origen" placeholder="Ej: Examen Tema 1, Reto 2, Práctica Taller" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 focus:outline-none font-medium">
            </div>
        </div>

        <!-- Alumnos y Asignación de Calificaciones -->
        <div class="bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h2 class="font-bold text-slate-800 text-base flex items-center gap-2">
                    <i class="fa-solid fa-users text-emerald-600"></i>
                    Listado de Alumnos y Notas (0 - 10)
                </h2>
                <div class="flex items-center gap-2">
                    <span id="save-status-badge" class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full font-semibold border">Listo</span>
                    <button onclick="agregarNuevoAlumno()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg transition flex items-center gap-1 shadow-sm">
                        <i class="fa-solid fa-user-plus"></i> + Añadir Alumno
                    </button>
                </div>
            </div>

            <div class="p-6">
                <div id="contenedor-alumnos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                </div>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSy_Hispanidad_FirebaseKey_Placeholder",
            authDomain: "cyberbreakout-hispanidad.firebaseapp.com",
            projectId: "cyberbreakout-hispanidad",
            storageBucket: "cyberbreakout-hispanidad.appspot.com",
            messagingSenderId: "1035515234125",
            appId: "1:1035515234125:web:hispanidad2026"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        db.enablePersistence({ synchronizeTabs: true }).catch(err => console.log("Persistencia local:", err.code));

        function normalizarCurso(cursoRaw) {
            if (!cursoRaw) return '2ESO';
            const str = String(cursoRaw).toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (str.includes('2')) return '2ESO';
            if (str.includes('3')) return '3ESO';
            if (str.includes('4')) return '4ESO';
            return '2ESO';
        }

        const criteriosLOMLOE = {
            '2ESO': ['TYD.2.1.1', 'TYD.2.1.2', 'TYD.2.2.1', 'TYD.2.3.1', 'TYD.2.4.1', 'TYD.2.5.1'],
            '3ESO': ['TYD.3.1.1', 'TYD.3.1.2', 'TYD.3.2.1', 'TYD.3.3.1', 'TYD.3.4.1', 'TYD.3.5.1'],
            '4ESO': ['DIG.4.1.1', 'DIG.4.1.2', 'DIG.4.2.1', 'DIG.4.3.1', 'DIG.4.4.1', 'DIG.4.5.1']
        };

        let listaAlumnos = [];

        function cargarAlumnos() {
            // Leer sin machacar de evaluador_directo_alumnos_v2 u otras listas en localStorage
            const local = JSON.parse(localStorage.getItem('evaluador_directo_alumnos_v2') || '[]');
            if (Array.isArray(local) && local.length > 0) {
                listaAlumnos = local;
            }

            // Sincronizar desde la nube si existen alumnos en Firebase
            db.collection('alumnos_v2').onSnapshot(snapshot => {
                if (!snapshot.empty) {
                    const deNube = [];
                    snapshot.forEach(doc => deNube.push(doc.data()));
                    if (deNube.length > 0) {
                        // Combinar sin duplicar por ID
                        deNube.forEach(aNube => {
                            const idx = listaAlumnos.findIndex(a => a.id === aNube.id);
                            if (idx !== -1) {
                                listaAlumnos[idx] = { ...listaAlumnos[idx], ...aNube };
                            } else {
                                listaAlumnos.push(aNube);
                            }
                        });
                        localStorage.setItem('evaluador_directo_alumnos_v2', JSON.stringify(listaAlumnos));
                        renderizarAlumnos();
                    }
                }
            });
        }

        function actualizarCriteriosYCargar() {
            const curso = document.getElementById('select-curso').value;
            const selectCrit = document.getElementById('select-criterio');
            selectCrit.innerHTML = '';
            
            (criteriosLOMLOE[curso] || []).forEach(crit => {
                const opt = document.createElement('option');
                opt.value = crit;
                opt.innerText = crit;
                selectCrit.appendChild(opt);
            });

            renderizarAlumnos();
        }

        function renderizarAlumnos() {
            const cursoSeleccionado = document.getElementById('select-curso').value;
            const contenedor = document.getElementById('contenedor-alumnos');
            contenedor.innerHTML = '';

            const alumnosCurso = listaAlumnos.filter(a => normalizarCurso(a.curso || a.grupo) === cursoSeleccionado);

            if (alumnosCurso.length === 0) {
                contenedor.innerHTML = `<div class="col-span-full py-8 text-center text-slate-400">No hay alumnos añadidos para ${cursoSeleccionado}. Presiona "+ Añadir Alumno".</div>`;
                return;
            }

            alumnosCurso.forEach(alum => {
                const card = document.createElement('div');
                card.className = "bg-slate-50 border border-slate-200 rounded-lg p-4 shadow-sm flex items-center justify-between gap-3";
                card.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden">
                        <i class="fa-solid fa-user-circle text-2xl text-slate-400"></i>
                        <span class="font-bold text-sm text-slate-800 truncate">${alum.nombre}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="number" min="0" max="10" step="0.1" placeholder="0-10" id="input-nota-${alum.id}"
                            class="w-16 bg-white border border-slate-300 text-center font-extrabold text-sm rounded-md py-1.5 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <button onclick="guardarNotaAlumno('${alum.id}', '${alum.nombre.replace(/'/g, "\'")}')" class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-md font-bold text-xs transition flex items-center gap-1 shadow-xs">
                            <i class="fa-solid fa-floppy-disk"></i> Guardar
                        </button>
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        function guardarNotaAlumno(alumnoId, nombreAlumno) {
            const curso = document.getElementById('select-curso').value;
            const criterio = document.getElementById('select-criterio').value;
            const origenRaw = document.getElementById('input-origen').value;
            const notaVal = parseFloat(document.getElementById(`input-nota-${alumnoId}`).value);

            if (isNaN(notaVal) || notaVal < 0 || notaVal > 10) {
                alert("Por favor introduce una nota válida entre 0 y 10.");
                return;
            }

            const origen = (origenRaw && origenRaw.trim() !== '') ? origenRaw.trim() : `Evaluación Directa ${criterio}`;
            const badge = document.getElementById('save-status-badge');
            badge.className = "text-xs bg-amber-100 text-amber-800 px-3 py-1 rounded-full font-semibold border border-amber-300 animate-pulse";
            badge.innerText = "Guardando...";

            // 1. Guardar en LocalStorage
            let pruebasLocales = JSON.parse(localStorage.getItem('evaluador_directo_pruebas_v8') || '[]');
            const idx = pruebasLocales.findIndex(p => p.alumnoId === alumnoId && p.criterio === criterio && (p.origen || '').trim() === origen);
            if (idx !== -1) {
                pruebasLocales[idx].nota = notaVal;
            } else {
                pruebasLocales.push({ alumnoId, nombreAlumno, curso, criterio, nota: notaVal, origen });
            }
            localStorage.setItem('evaluador_directo_pruebas_v8', JSON.stringify(pruebasLocales));

            // 2. Sincronizar Alumno + Nota en Firebase Firestore (Nube multi-dispositivo)
            const alumRef = db.collection('alumnos_v2').doc(alumnoId);
            alumRef.set({ id: alumnoId, nombre: nombreAlumno, curso: curso }, { merge: true });

            const docId = `${alumnoId}_${criterio}_${encodeURIComponent(origen)}`;
            db.collection('evaluacion_directa').doc(docId).set({
                alumnoId: alumnoId,
                nombreAlumno: nombreAlumno,
                curso: curso,
                criterio: criterio,
                nota: notaVal,
                origen: origen,
                fecha: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).then(() => {
                badge.className = "text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-semibold border border-emerald-300";
                badge.innerText = "¡Guardado en Nube y Local!";
                setTimeout(() => { badge.innerText = "Listo"; badge.className = "text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full font-semibold border"; }, 2500);
            }).catch(err => {
                console.error("Error al sincronizar con Firebase:", err);
                badge.className = "text-xs bg-amber-100 text-amber-800 px-3 py-1 rounded-full font-semibold border border-amber-300";
                badge.innerText = "Guardado Local (Offline)";
            });
        }

        function agregarNuevoAlumno() {
            const nombre = prompt("Introduce el nombre completo del alumno:");
            if (!nombre || nombre.trim() === '') return;

            const curso = document.getElementById('select-curso').value;
            const nuevoId = 'alum_' + Date.now();
            const nuevo = { id: nuevoId, nombre: nombre.trim(), curso: curso };

            listaAlumnos.push(nuevo);
            localStorage.setItem('evaluador_directo_alumnos_v2', JSON.stringify(listaAlumnos));
            
            // Subir alumno a Firebase
            db.collection('alumnos_v2').doc(nuevoId).set(nuevo, { merge: true });

            renderizarAlumnos();
        }

        window.addEventListener('DOMContentLoaded', () => {
            cargarAlumnos();
            actualizarCriteriosYCargar();
        });
    </script>
</body>
</html>
